    <script>
      // The theme before the first paint: the device's, unless a light or a dark one was chosen in this browser. The
      // choice is the content of <meta name="color-scheme"> ("light dark" is the device's), which the style sheet makes
      // the page's colour scheme; data-theme says the theme shown, for what draws in it. The app keeps both once it runs.
      (function () {
        var theme = null;
        try { theme = JSON.parse(localStorage.getItem("settings") || "{}").theme; } catch (error) { /* no storage: the device's */ }
        if (theme !== "light" && theme !== "dark") theme = null;
        document.querySelector('meta[name="color-scheme"]').content = theme || "light dark";
        document.documentElement.setAttribute("data-theme", theme || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
      })();
    </script>
