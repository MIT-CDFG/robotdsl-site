name: Site or Studio problem
description: Something on the project page, in the Studio or in the documentation does not work or looks wrong.
labels: ["bug"]
body:
  - type: input
    id: where
    attributes:
      label: Page
      placeholder: https://robotdsl.csail.mit.edu/studio/
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and result
      description: What you did, what you expected and what happened. A screenshot helps.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Browser and device
      placeholder: Safari 19, iPhone 15
    validations:
      required: true
