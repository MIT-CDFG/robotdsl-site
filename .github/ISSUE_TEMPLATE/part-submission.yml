name: Submit a part
description: A product, or a part of your own, to add to the component library.
labels: ["part submission"]
body:
  - type: markdown
    attributes:
      value: |
        A maintainer builds the part from this, and it appears in the Studio with your credit.
  - type: input
    id: name
    attributes:
      label: Part name
      placeholder: e.g. Pololu 90×10mm wheel pair, black
    validations:
      required: true
  - type: input
    id: page
    attributes:
      label: Link
      description: Where it is sold, or where its files are. A product page, Printables, GitHub or a Google Drive link.
      placeholder: https://
    validations:
      required: true
  - type: dropdown
    id: category
    attributes:
      label: Kind
      options:
        - chassis
        - wheel
        - track
        - motor
        - battery
        - motor driver
        - sensor
        - attachment (an arm, a gripper, a computer, a bracket, …)
    validations:
      required: true
  - type: input
    id: price
    attributes:
      label: Price
      description: Leave empty for a part that is not sold.
      placeholder: e.g. 7.45 USD for a pair
  - type: input
    id: size
    attributes:
      label: Mass and size
      placeholder: e.g. 20 g, 90 mm across, 10 mm wide
    validations:
      required: true
  - type: textarea
    id: specifications
    attributes:
      label: Specifications
      description: What its kind needs, with the page or data sheet each number is from.
      placeholder: |
        wheel: diameter, width
        track: length on the ground, width, travel per turn of its sprocket
        motor: voltage, no-load speed, stall torque, stall current, gear ratio
        battery: voltage, capacity, largest current
        motor driver: supply voltage, channels, current per channel
        sensor: what it measures, range, field of view, rate
        chassis: how it steers, where the wheels and motors go
  - type: textarea
    id: mounting
    attributes:
      label: How it mounts
      placeholder: e.g. on a 3 mm D shaft; or four M3 holes, 32 mm apart, on its flat underside
    validations:
      required: true
  - type: textarea
    id: model
    attributes:
      label: 3D model
      description: A zip dropped here (up to 25 MB) or a link. STEP, STL, OBJ or GLB; say whether it is in millimetres or metres.
    validations:
      required: true
  - type: dropdown
    id: licence
    attributes:
      label: Licence
      description: The library publishes the 3D model, so a part of your own needs one.
      options:
        - A product, under its maker's rights
        - CC BY 4.0
        - CC BY-SA 4.0
        - CC0 1.0
        - MIT
        - Other (say which in the notes)
    validations:
      required: true
  - type: checkboxes
    id: rights
    attributes:
      label: Rights
      options:
        - label: It is a product sold at the link above, or I made this part and may publish it under the licence I chose.
          required: true
  - type: textarea
    id: declaration
    attributes:
      label: component.yaml
      description: Only if you have written one.
      render: yaml
  - type: textarea
    id: notes
    attributes:
      label: Notes
